{% extends "accounts/base.html" %}
{% block content %}
<h2>Manage laboratories</h2>
<p><a href="{% url 'laboratory_create' %}">Add laboratory</a></p>
<div class="table-scroll"><table><thead><tr><th>Code</th><th>Name</th><th>Location</th><th>Action</th></tr></thead>
<tbody>{% for lab in labs %}<tr><td>{{ lab.code }}</td><td>{{ lab.name }}</td><td>{{ lab.location }}</td><td><a href="{% url 'laboratory_edit' lab.id %}">Edit / assign managers</a></td></tr>
{% empty %}<tr><td colspan="4">No laboratories yet.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
