{% extends "accounts/base.html" %}
{% block content %}
<h2>Choose a new password</h2>
{% if validlink %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Save password</button></form>
{% else %}
<p>This reset link is invalid or has expired.</p>
<p><a href="{% url 'password_reset' %}">Request a new link</a></p>
{% endif %}
{% endblock %}
